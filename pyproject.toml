[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "multicopter-surrogates"
version = "0.1.0"
description = "FMU execution, data generation and surrogate models for a Modelica multicopter powertrain model"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Andrej Lier" }]
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "matplotlib",
    "fmpy",
]

[project.optional-dependencies]
ml = ["torch"]
dev = ["pytest", "ruff"]

[tool.setuptools.packages.find]
where = ["python/src"]

[tool.pytest.ini_options]
testpaths = ["python/tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "NPY"]

[tool.ruff.lint.isort]
known-first-party = ["multicopter_surrogates"]
